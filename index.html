let AC=null,MG=null,NB=null;
function audio(){if(AC)return AC;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();MG=AC.createGain();MG.gain.value=0.35;MG.connect(AC.destination);
 NB=AC.createBuffer(1,AC.sampleRate*0.6,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}return AC}
function unlockAudio(){const a=audio();if(a&&a.state==='suspended')a.resume().catch(()=>{})}
function envG(t,a,peak,d){const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);g.connect(MG);return g}
function noise(t,dur,peak,ftype,f,q){const s=AC.createBufferSource();s.buffer=NB;const fl=AC.createBiquadFilter();fl.type=ftype;fl.frequency.value=f;fl.Q.value=q||1;const g=envG(t,0.005,peak,dur);s.connect(fl);fl.connect(g);s.start(t);s.stop(t+dur+0.05)}
function tone(t,type,f0,f1,dur,peak){const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);const g=envG(t,0.01,peak,dur);o.connect(g);o.start(t);o.stop(t+dur+0.05)}
let lastOof=0;
function sfx(kind,amt){if(save.mute)return;const a=audio();if(!a||a.state!=='running')return;const t=a.currentTime;amt=amt==null?1:amt;
 try{switch(kind){
  case 'oof':{if(t-lastOof<0.12)return;lastOof=t;const f0=rnd(120,190);const o=a.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f0*1.3,t);o.frequency.exponentialRampToValueAtTime(f0*0.65,t+0.24);
   const g=envG(t,0.015,0.55*clamp(0.45+amt*0.55,0.3,1),0.24);for(const [ff,q] of [[620,5],[1000,6],[2400,8]]){const fl=a.createBiquadFilter();fl.type='bandpass';fl.frequency.value=ff*rnd(0.92,1.08);fl.Q.value=q;o.connect(fl);fl.connect(g)}
   o.start(t);o.stop(t+0.32);noise(t,0.05,0.12*amt,'lowpass',500);break}
  case 'thud':noise(t,0.12,0.25*amt,'lowpass',260);tone(t,'sine',140,50,0.12,0.25*amt);break;
  case 'boing':tone(t,'sine',180,520,0.25,0.18);tone(t+0.04,'triangle',240,700,0.22,0.08);break;
  case 'crash':noise(t,0.25,0.22,'highpass',2500,0.7);noise(t,0.12,0.15,'bandpass',900,1);break;
  case 'splat':noise(t,0.18,0.25,'lowpass',700,2);tone(t,'sine',300,90,0.14,0.12);break;
  case 'boom':noise(t,0.6,0.4,'lowpass',420,0.8);tone(t,'sine',90,35,0.5,0.35);for(let i=0;i<5;i++)tone(t+0.08+i*0.06,'square',rnd(900,1800),rnd(1500,2600),0.05,0.03);break;
  case 'ding':tone(t,'sine',880,880,0.25,0.14);tone(t+0.07,'sine',1320,1320,0.3,0.1);break;
  case 'grab':tone(t,'square',300,600,0.08,0.06);break;
  case 'whoosh':noise(t,0.35,0.12,'bandpass',800+600*amt,0.8);break;
  case 'stretch':tone(t,'triangle',80+amt*120,90+amt*130,0.06,0.03);break;
  case 'click':tone(t,'square',700,700,0.04,0.05);break;
  case 'pins':for(let i=0;i<Math.min(6,amt);i++)tone(t+i*0.04,'triangle',rnd(500,900),rnd(300,500),0.08,0.08);noise(t,0.2,0.1,'bandpass',1800,2);break;
  case 'flip':tone(t,'sine',500,1000,0.15,0.08);break;
  case 'fanfare':[523,659,784,1047].forEach((f,i)=>tone(t+i*0.11,'triangle',f,f,0.18,0.09));break;
 }}catch(e){}}

function stackRow(x,yb,n,w,h,kind,gap){gap=gap||0;const tot=n*w+(n-1)*gap;for(let i=0;i<n;i++)box(x-tot/2+w/2+i*(w+gap),yb,w,h,kind)}
function pyramid(x,yb,n,w,h,kind){for(let r=0;r<n;r++)stackRow(x,yb-r*h,n-r,w,h,kind,2)}
function tower(x,yb,n,w,h,kind){for(let r=0;r<n;r++)box(x,yb-r*h,w,h,kind)}
function bbox(b){let a=1e9,c=-1e9,d=1e9,e=-1e9;for(const p of b.parts){if(p.x-p.r<a)a=p.x-p.r;if(p.x+p.r>c)c=p.x+p.r;if(p.y-p.r<d)d=p.y-p.r;if(p.y+p.r>e)e=p.y+p.r}b.minX=a;b.maxX=c;b.minY=d;b.maxY=e}
const ovl=(a,b,m)=>a.minX<b.maxX+m&&b.minX<a.maxX+m&&a.minY<b.maxY+m&&b.minY<a.maxY+m;
function wake(b){if(!b.sleep||b.dead)return;b.sleep=false;b.still=0;for(const o of bodies)if(o.sleep&&!o.dead&&o.type!=='pete'&&ovl(b,o,4))wake(o)}
function boxCenter(b){const c=b.parts;return [(c[0].x+c[1].x+c[2].x+c[3].x)/4,(c[0].y+c[1].y+c[2].y+c[3].y)/4]}
function boxAng(b){const c=b.parts;return Math.atan2(c[1].y-c[0].y,c[1].x-c[0].x)}

function contactStatic(p,nx,ny,s,vx,vy){const vn=-(vx*nx+vy*ny);if(!p.cont||vn>p.cont.vn)p.cont={nx,ny,vn,s}}
function segX(p0x,p0y,p1x,p1y,ax,ay,bx,by){const rx=p1x-p0x,ry=p1y-p0y,sx=bx-ax,sy=by-ay,den=rx*sy-ry*sx;if(Math.abs(den)<1e-9)return -1;const qx=ax-p0x,qy=ay-p0y,t=(qx*sy-qy*sx)/den,u=(qx*ry-qy*rx)/den;return(t>=0&&t<=1&&u>=0&&u<=1)?t:-1}
function vsSegs(p,first){const r=p.r;for(const s of segs){
  if(p.x+r<s.minX&&p.px+r<s.minX)continue;if(p.x-r>s.maxX&&p.px-r>s.maxX)continue;if(p.y+r<s.minY&&p.py+r<s.minY)continue;if(p.y-r>s.maxY&&p.py-r>s.maxY)continue;
  const ex=s.x2-s.x1,ey=s.y2-s.y1,L2=ex*ex+ey*ey;let t=((p.x-s.x1)*ex+(p.y-s.y1)*ey)/L2;t=t<0?0:t>1?1:t;const cx=s.x1+ex*t,cy=s.y1+ey*t;let dx=p.x-cx,dy=p.y-cy;const d2=dx*dx+dy*dy;
  if(d2<r*r){let d=Math.sqrt(d2),nx,ny;if(d<1e-4){nx=s.nx;ny=s.ny}else{nx=dx/d;ny=dy/d}
   // only resolve from the outward side for the open faces (prevents being sucked through thin plats)
   const vx=p.x-p.px,vy=p.y-p.py;const pen=r-d;p.x+=nx*pen;p.y+=ny*pen;contactStatic(p,nx,ny,s,vx,vy);continue}
  if(first){const tt=segX(p.px,p.py,p.x,p.y,s.x1,s.y1,s.x2,s.y2);if(tt>=0){let nx=s.nx,ny=s.ny;if((p.px-s.x1)*nx+(p.py-s.y1)*ny<0){nx=-nx;ny=-ny}
   const vx=p.x-p.px,vy=p.y-p.py;const ix=p.px+vx*tt,iy=p.py+vy*tt;p.x=ix+nx*(r+0.5);p.y=iy+ny*(r+0.5);contactStatic(p,nx,ny,s,vx,vy)}}}}
function hitEv(a,b,s,p){ // a,b bodies; s approach speed px/s
 if(s<=0)return;if(a)a.imp=Math.max(a.imp,s);if(b)b.imp=Math.max(b.imp,s);
 if(a===pete&&p&&p.idx!=null)pete.pimp[p.idx]=Math.max(pete.pimp[p.idx],s);}
function pvb(p,B,r){if(p.x+r<B.minX||p.x-r>B.maxX||p.y+r<B.minY||p.y-r>B.maxY)return;const c=B.parts;let best=-1e9,bi=0,bnx=0,bny=0;
 for(let i=0;i<4;i++){const a=c[i],b=c[(i+1)&3],ex=b.x-a.x,ey=b.y-a.y,L=Math.hypot(ex,ey)||1,nx=ey/L,ny=-ex/L,d=(p.x-a.x)*nx+(p.y-a.y)*ny-r;if(d>=0)return;if(d>best){best=d;bi=i;bnx=nx;bny=ny}}
 const a=c[bi],b=c[(bi+1)&3],ex=b.x-a.x,ey=b.y-a.y,L2=ex*ex+ey*ey||1;let t=((p.x-a.x)*ex+(p.y-a.y)*ey)/L2;t=t<0?0:t>1?1:t;
 const ip=eff(p),ia=eff(a),ib=eff(b),wa=1-t,wb=t,den=ip+wa*wa*ia+wb*wb*ib;
 if(B.sleep&&!p.body.sleep&&-best>0.6){wake(B);}
 if(den<=0)return;const pen=-best,lam=pen/den;
 const vpx=p.x-p.px,vpy=p.y-p.py,vex=(a.x-a.px)*wa+(b.x-b.px)*wb,vey=(a.y-a.py)*wa+(b.y-b.py)*wb,vrn=(vpx-vex)*bnx+(vpy-vey)*bny;
 p.x+=bnx*lam*ip;p.y+=bny*lam*ip;a.x-=bnx*lam*ia*wa;a.y-=bny*lam*ia*wa;b.x-=bnx*lam*ib*wb;b.y-=bny*lam*ib*wb;
 const tx=-bny,ty=bnx,vt=(vpx-vex)*tx+(vpy-vey)*ty;let jt=-vt*0.35/den;const mx=0.8*lam*(p.mu||1);if(jt>mx)jt=mx;if(jt<-mx)jt=-mx;
 p.x+=tx*jt*ip;p.y+=ty*jt*ip;a.x-=tx*jt*ia*wa;a.y-=ty*jt*ia*wa;b.x-=tx*jt*ib*wb;b.y-=ty*jt*ib*wb;
 if(vrn<0)hitEv(p.body,B,-vrn/DT,p)}
function cvc(p,q){const dx=q.x-p.x,dy=q.y-p.y,R=p.r+q.r,d2=dx*dx+dy*dy;if(d2>=R*R||d2<1e-6)return;const ip=eff(p),iq=eff(q);
 if(q.body.sleep&&!p.body.sleep)wake(q.body);if(p.body.sleep&&!q.body.sleep)wake(p.body);if(ip+iq<=0)return;
 const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,pen=R-d,lam=pen/(ip+iq),vrn=((q.x-q.px)-(p.x-p.px))*nx+((q.y-q.py)-(p.y-p.py))*ny;
 p.x-=nx*lam*ip;p.y-=ny*lam*ip;q.x+=nx*lam*iq;q.y+=ny*lam*iq;
 if(vrn<0){hitEv(p.body,q.body,-vrn/DT,p);if(q.body===pete)pete.pimp[q.idx]=Math.max(pete.pimp[q.idx],-vrn/DT)}}
function solveSticks(){for(const s of sticks){const a=s.a,b=s.b,ia=eff(a),ib=eff(b);if(ia+ib<=0)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1e-4;
 const diff=(d-s.len)/(d*(ia+ib))*s.k;a.x+=dx*diff*ia;a.y+=dy*diff*ia;b.x-=dx*diff*ib;b.y-=dy*diff*ib}}
function physStep(){simT+=DT;
 for(const g of grabs)if(g.mv){const ox=g.x,oy=g.y;g.mv(g,simT);g.vx=(g.x-ox)/DT;g.vy=(g.y-oy)/DT}
 for(const t of targets)if(t.mv&&!t.hit)t.mv(t,simT);
 if(pete)pete.pimp.fill(0);for(const b of bodies)b.imp=0;
 for(const p of parts){p.cont=null;if(p.pin){p.px=p.x;p.py=p.y;p.x=p.pin.x;p.py+=0;p.y=p.pin.y;continue}if(p.body.sleep||p.body.kin)continue;let vx=(p.x-p.px)*AIRD,vy=(p.y-p.py)*AIRD;const v2=vx*vx+vy*vy;if(v2>VMAXS*VMAXS){const f=VMAXS/Math.sqrt(v2);vx*=f;vy*=f}
  p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+GRAV*DT*DT}
 const act=bodies.filter(b=>!b.sleep&&!b.dead&&!b.kin);
 for(let it=0;it<ITER;it++){
  solveSticks();
  for(const p of parts)if(p.pin){p.x=p.pin.x;p.y=p.pin.y}
  for(const b of bodies)if(!b.dead&&!b.kin)bbox(b);
  for(const A of act){
   for(const p of A.parts)if(!p.pin)vsSegs(p,it===0);
   for(const B of bodies){if(B===A||B.dead||B.kin)continue;if(!B.sleep&&B.id<A.id)continue;if(!ovl(A,B,2))continue;
    if(A.type==='box'&&B.type==='box'){for(const p of A.parts)pvb(p,B,1);for(const q of B.parts)pvb(q,A,1)}
    else if(B.type==='box'){for(const p of A.parts)pvb(p,B,p.r)}
    else if(A.type==='box'){for(const q of B.parts)pvb(q,A,q.r)}
    else{for(const p of A.parts)for(const q of B.parts)cvc(p,q)}}
   if(A.type==='box')for(const v of svx){if(v.x<A.minX-1||v.x>A.maxX+1||v.y<A.minY-1||v.y>A.maxY+1)continue;pvb({x:v.x,y:v.y,px:v.x,py:v.y,inv:0,pin:1,body:{sleep:true},mu:1},A,0.5)}
  }
 }
 // bounce + friction for static contacts
 for(const p of parts){const c=p.cont;if(!c||p.pin)continue;const s=c.s,nx=c.nx,ny=c.ny;let vx=p.x-p.px,vy=p.y-p.py;const vn=vx*nx+vy*ny;let tx=vx-vn*nx,ty=vy-vn*ny;
  const inc=Math.max(0,c.vn);let out=0;const bo=Math.max(s.bo,(p.body.k&&p.body.k.bo)||0);

  const nvx=tx+nx*out,nvy=ty+ny*out;p.px=p.x-nvx;p.py=p.y-nvy;
  if(p.body===pete&&s.tramp&&ny<-0.5&&out>inc*0.9&&inc>120*DT&&(!pete.tr||out>pete.tr.out))pete.tr={nx,ny,out};
  hitEv(p.body,null,inc/DT,p);if(p.body===pete&&s.tramp&&inc>150*DT)pete.boing=1;if(p.body===pete)pete.touchT=0}
 if(pete&&pete.tr){const t=pete.tr;pete.tr=null;for(const q of pete.parts){if(q.pin)continue;const vx=q.x-q.px,vy=q.y-q.py,vn=vx*t.nx+vy*t.ny;const nv=Math.max(vn,t.out*0.97);q.px=q.x-(vx+(nv-vn)*t.nx);q.py=q.y-(vy+(nv-vn)*t.ny)}}

}

  if(!sane(score)||(G.order==='desc'&&score<=0&&!G.allowZero))return null;const n=LS.getItem(NAMEK);if(!n)return gameOver(score,o);
  const pb=jget('pa_lb_pb:'+boardId(b),null);if(pb!=null&&!better(score,pb))return{kept:true};return{sent:await post(score,b,n),quiet:true}}
/* game's own saved best (G.best expression) feeds the board */
const defBoard=()=>(G.boards&&G.boards[0]&&G.boards[0].id)||'main';
function localBest(){if(!G.bestF)return null;let v;try{v=Math.round(+G.bestF())}catch(e){return null}return sane(v)&&(v>0||G.allowZero)?v:null}
function unposted(b){const B=localBest();if(B==null)return null;const P=jget('pa_lb_posted:'+boardId(b),null);if(!REMOTE){const L=jget('pa_lb_pb:'+boardId(b),null);return L==null||better(B,L)?B:null}return P==null||better(B,P)?B:null}
async function syncBest(reason){if(!G||open)return;const b=defBoard(),B=unposted(b);if(B==null)return false;const n=LS.getItem(NAMEK);
  if(n){await post(B,b,n);return true}
  const AK='pa_lb_asked:'+boardId(b);if(reason==='load'&&jget(AK,null)===B)return false;jset(AK,B);
  await gameOver(B,{board:b,best:B,label:'Your best on this phone',heading:'🏆 SHARE YOUR BEST'});return true}
async function tapShow(){if(G&&G.bestF){const B=unposted(defBoard());if(B!=null&&!LS.getItem(NAMEK)){await syncBest('tap');return}if(B!=null)await post(B,defBoard(),LS.getItem(NAMEK))}return show()}
async function bestOver(score){const b=defBoard(),B=localBest();if(B==null||unposted(b)==null)return;const n=LS.getItem(NAMEK);
  if(!n)return gameOver(score,{board:b,best:B,newBest:B===score});const sent=await post(B,b,n);

/* watch: no game-code edits needed. when/score/board are JS expressions evaluated in the game's global scope. */
function watch(w){const F=s=>s==null?()=>undefined:typeof s==='function'?s:Function('try{return ('+s+')}catch(e){return undefined}');const when=F(w.when),sc=F(w.score),bd=F(w.board),ok=F(w.valid||'true');let was=false;

function init(o){G=Object.assign({order:'desc',unit:'pts',min:0,max:1e9,top:10,boards:null,muted:()=>{try{return typeof muted!=='undefined'&&!!muted}catch(e){return false}}},o);G.title=G.title||document.title;if(o.best)G.bestF=typeof o.best==='function'?o.best:Function('try{return ('+o.best+')}catch(e){return undefined}');

/* postNow: post the current run's score right away (used by the sample "Unlock" screen), else just open the board */
async function postNow(){if(!G)return;const F=x=>x==null?()=>undefined:typeof x==='function'?x:Function('try{return ('+x+')}catch(e){return undefined}');
  for(const w of G.watchList||[]){if(F(w.valid||'true')()===false)continue;const s=F(w.score)();if(s==null||!isFinite(s)||!sane(Math.round(+s))||(G.order==='desc'&&+s<=0))continue;const b=F(w.board)()||undefined;
    const r=await (w.best?bestOver(s):(w.silent?submitQuiet:gameOver)(s,{board:b}));if(!open)return show(b);return r}

<script>
/* Pete's Pain: stick pulls the slingshot (like dragging back), A launches / grabs / continues */
(function(){

 if(state==='aim'){if(G.pan){G.pan=null;return}launchNow();return}
 if(state==='fly'){tryGrab();return}
 if(state==='tally'&&G.tallyT>0.5){nextShot();return}}
GamepadSupport.init({
 keys:{a:act,x:function(p){if(p&&state==='fly')tryGrab()},y:function(p){if(p&&state==='fly')tryGrab()},
  b:function(){},left:function(){},right:function(){},up:function(){},down:function(){},

});
